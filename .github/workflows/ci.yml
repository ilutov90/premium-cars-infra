# Checks docker-compose.yml and runs the local Vault setup end to end, the way it runs on a developer machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: POSTGRES_PASSWORD=x docker compose -f docker-compose.yml config -q
      - name: Production compose files
        run: |
          sed -e 's/^ACME_EMAIL=$/ACME_EMAIL=ci@example.com/' -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=x/' \
              -e 's/^POSTGRES_SUPERUSER_PASSWORD=$/POSTGRES_SUPERUSER_PASSWORD=y/' .env.prod.example > .env.prod
          docker compose -f docker-compose.prod.yml --env-file .env.prod config -q
          docker compose -f docker-compose.prod.yml -f docker-compose.prod.local.yml --env-file .env.prod config -q
      - name: Caddyfile
        run: |
          docker run --rm -e SITE_DOMAIN=premiumcarsimport.bg -e ACME_EMAIL=ci@example.com -e HSTS=max-age=31536000 \
            -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10 caddy validate --config /etc/caddy/Caddyfile
      - name: Shell scripts
        run: |
          for f in scripts/*.sh vault/scripts/*.sh postgres/init-prod/*.sh; do bash -n "$f"; done
          shellcheck -S warning scripts/*.sh vault/scripts/*.sh postgres/init-prod/*.sh

  # The production database and Vault as on the server (no app images needed): separate app user, AppRole file
  # readable by the backend's user, root token removed from disk, restart unseals without it.
  production-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: First start
        run: |
          {
            echo "SITE_DOMAIN=premiumcarsimport.bg"
            echo "ACME_EMAIL=ci@example.com"
            echo "POSTGRES_PASSWORD=app-$(openssl rand -hex 8)"
            echo "POSTGRES_SUPERUSER_PASSWORD=su-$(openssl rand -hex 8)"
          } > .env.prod
          ./scripts/prod.sh up -d postgres vault vault-init
          ./scripts/prod.sh wait vault-init
          ./scripts/prod.sh logs vault-init
          sudo test "$(sudo stat -c '%u %a' vault/secrets-prod/backend/backend-approle.properties)" = "10001 400"
          echo "root=$(sudo sed -n 's/^Initial Root Token: //p' vault/secrets-prod/init.txt)" >> "$GITHUB_ENV"
      - name: The backend's database user owns the database but is not a superuser
        run: |
          pw=$(sed -n 's/^POSTGRES_PASSWORD=//p' .env.prod)
          ./scripts/prod.sh exec -T postgres psql "postgresql://premiumcars:$pw@localhost/premiumcars" -tA -c \
            "CREATE TABLE ci_check (i int); DROP TABLE ci_check; SELECT rolsuper FROM pg_roles WHERE rolname = current_user;" \
            | grep -qx f
      - name: Import with the root token from the environment, then remove it from disk
        run: |
          printf 'RESEND_API_KEY=re_ci_dummy\nAUTOWINI_USER=demo\n' | VAULT_TOKEN=$root ./scripts/prod.sh vault import
          ./scripts/prod.sh vault forget-root-token
          ! sudo grep -q 'Root Token' vault/secrets-prod/init.txt
          # without the token: refused; with it: works
          ! ./scripts/prod.sh vault keys
          VAULT_TOKEN=$root ./scripts/prod.sh vault keys | tee keys.txt
          grep -q RESEND_API_KEY keys.txt && grep -q DB_PASSWORD keys.txt
      - name: After a restart Vault unseals without the root token
        run: |
          ./scripts/prod.sh restart vault
          sleep 3
          ./scripts/prod.sh up -d postgres vault vault-init
          ./scripts/prod.sh wait vault-init
          ./scripts/prod.sh logs vault-init | grep -q "setup is skipped"
          ./scripts/prod.sh exec -T vault vault status -format=json | grep -q '"sealed": false'
      - name: Without vault-init (server reboot) the unsealer opens Vault on its own
        run: |
          ./scripts/prod.sh up -d vault-unsealer
          ./scripts/prod.sh restart vault
          for i in $(seq 1 30); do
            ./scripts/prod.sh exec -T vault vault status -format=json 2>/dev/null | grep -q '"sealed": false' && break
            sleep 2
          done
          ./scripts/prod.sh exec -T vault vault status -format=json | grep -q '"sealed": false'
          ./scripts/prod.sh logs vault-unsealer | grep -q "Vault is sealed: unsealing"
      - if: always()
        run: ./scripts/prod.sh logs

  vault-setup:
    runs-on: ubuntu-latest
    env:
      VAULT: http://127.0.0.1:8200
      SECRET: http://127.0.0.1:8200/v1/secret/data/premium-cars/backend
    steps:
      - uses: actions/checkout@v5

      - name: First start initialises Vault and prepares the backend secret
        run: |
          echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)" > .env
          docker compose up -d
          docker compose wait vault-init
          docker compose logs vault-init
          sudo test -s vault/secrets/init.txt
          sudo test -s vault/secrets/backend-approle.properties
          sudo test -s vault/secrets/admin-initial-password.txt

      - name: The backend's AppRole can read its secret and nothing else
        run: |
          props=$(sudo cat vault/secrets/backend-approle.properties)
          role=$(echo "$props" | sed -n 's/^spring.cloud.vault.app-role.role-id=//p')
          sid=$(echo "$props" | sed -n 's/^spring.cloud.vault.app-role.secret-id=//p')
          token=$(curl -sf -X POST -d "{\"role_id\":\"$role\",\"secret_id\":\"$sid\"}" $VAULT/v1/auth/approle/login | jq -r .auth.client_token)
          echo "token=$token" >> "$GITHUB_ENV"
          data=$(curl -sf -H "X-Vault-Token: $token" $SECRET | jq .data.data)
          pg=$(sed -n 's/^POSTGRES_PASSWORD=//p' .env)
          echo "$data" | jq -e --arg pg "$pg" '.DB_USERNAME == "premiumcars" and .DB_PASSWORD == $pg and (.ADMIN_INITIAL_PASSWORD | length) == 24'
          # read-only: writing is refused
          ! curl -sf -X POST -H "X-Vault-Token: $token" -d '{"data":{"X":"1"}}' $SECRET
          # other paths are refused
          ! curl -sf -H "X-Vault-Token: $token" $VAULT/v1/secret/data/other
          # profile variants answer 404 (allowed, empty), not 403
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H "X-Vault-Token: $token" $SECRET/default)" = "404" ]

      - name: Import from a .env file (Windows line endings, quotes, unknown keys)
        run: |
          printf 'AUTOWINI_USER=demo\r\nAUTOWINI_PASS="p@ss word"\r\nUNKNOWN=1\r\n# comment\r\nFB_ACCESS_TOKEN=\r\nVIBER_CHANNEL_TOKEN=4f1a-demo\r\n' \
            | docker compose run --rm -T vault-init import
          curl -sf -H "X-Vault-Token: $token" $SECRET | jq -e '.data.data
            | .AUTOWINI_USER == "demo" and .AUTOWINI_PASS == "p@ss word" and (has("UNKNOWN") | not)
              and .VIBER_CHANNEL_TOKEN == "4f1a-demo"
              and (has("FB_ACCESS_TOKEN") | not) and (.DB_PASSWORD | length) > 0'

      - name: After a restart Vault is sealed; docker compose up unseals it and keeps the secrets
        run: |
          before=$(sudo cat vault/secrets/admin-initial-password.txt)
          docker compose restart vault
          sleep 3
          curl -s $VAULT/v1/sys/seal-status | jq -e '.sealed == true'
          docker compose up -d
          docker compose wait vault-init
          curl -s $VAULT/v1/sys/seal-status | jq -e '.sealed == false'
          curl -sf -H "X-Vault-Token: $token" $SECRET | jq -e '.data.data.AUTOWINI_USER == "demo"'
          [ "$before" = "$(sudo cat vault/secrets/admin-initial-password.txt)" ]
          docker compose run --rm -T vault-init keys

      - if: always()
        run: docker compose logs

  # Blocks commits that contain passwords, tokens or keys (scans the whole history of the branch)
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
